<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pichiclub</title>
<style>
  :root {
    --ink: #2B1B17; --cream: #FFF4E0; --cocoa: #3A2A24; --tomato: #E63B2E; --tomato2: #B5281F; --basil: #3FA34D; --basil2: #2A7A36;
    --cheese: #FFD23F; --cheese2: #E8A317; --muted: #8A7461; --crust: #D9963F; --danger: #D7263D;
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cocoa); color: var(--ink); font: 600 28px var(--font); }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  .off { display: none !important; }

  /* the 1920x1080 stage is scaled to the window, like the Phaser canvas */
  
  .stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--k, 1)); transform-origin: 50% 50%; pointer-events: none; }
  .stage > * { pointer-events: auto; }

  #lobbybg { position: fixed; inset: 0; background: var(--cocoa); overflow: hidden; }
  #lobbybg::before { content: ""; position: absolute; inset: -240px; background: repeating-conic-gradient(rgba(255,255,255,.15) 0 25%, transparent 0 50%) 0 0 / 120px 120px; opacity: .15; animation: drift 6s linear infinite; }
  #lobbybg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 40%, rgba(0,0,0,.45) 100%); }
  @keyframes drift { to { transform: translate(120px, 120px); } }

  .panel { background: var(--cream); border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 8px 0 rgba(43,27,23,.25); }
  .abs { position: absolute; }
  h1.title { position: absolute; left: 150px; top: 40px; margin: 0; font: 800 96px/1.05 var(--font); color: var(--tomato); -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; letter-spacing: 1px; text-shadow: 0 8px 0 rgba(43,27,23,.35); }
  #logo { position: absolute; left: 40px; top: 28px; width: 104px; height: 114px; animation: spin 14s linear infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.3)); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .platform { position: absolute; left: 154px; top: 148px; font: 800 24px var(--font); letter-spacing: 6px; text-transform: uppercase; color: var(--cheese); text-shadow: 0 3px 0 var(--ink); }

  #joincard { position: absolute; left: 80px; top: 200px; width: 520px; height: 620px; padding: 22px 0; text-align: center; }
  #joincard .lbl { font: 800 30px var(--font); }
  #qr { width: 340px; height: 340px; margin: 14px auto 0; background: var(--cream); border: 4px solid var(--ink); border-radius: 12px; padding: 8px; }
  #qr svg { width: 100%; height: 100%; display: block; }
  #qr svg path[fill] { fill: var(--cream); }
  #qr svg path[stroke] { stroke: var(--ink); }
  #code { font: 800 124px/1 var(--font); color: var(--tomato); -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; letter-spacing: 8px; margin: 12px 0 0 8px; text-shadow: 0 6px 0 rgba(43,27,23,.3); }
  #joinurl { font: 600 22px var(--font); color: var(--muted); margin-top: 6px; user-select: all; }

  button { font-family: var(--font); cursor: pointer; }
  .btn { height: 72px; padding: 0 40px; border: 4px solid var(--ink); border-radius: 16px; background: linear-gradient(var(--tomato) 0 50%, var(--tomato2) 50% 100%); color: var(--cream); font: 800 34px var(--font); box-shadow: 0 8px 0 rgba(43,27,23,.35); transition: transform .1s; text-shadow: 0 3px 0 rgba(43,27,23,.4); }
  .btn:hover { transform: scale(1.05); }
  .btn:active { transform: scale(0.98) translateY(4px); box-shadow: 0 4px 0 rgba(43,27,23,.35); }
  .btn:disabled { filter: grayscale(.8) brightness(.8); opacity: .6; cursor: not-allowed; transform: none; }
  #start { position: absolute; left: 80px; top: 872px; width: 520px; height: 96px; font-size: 44px; }
  #starthint { position: absolute; left: 80px; top: 976px; width: 520px; text-align: center; font: 600 22px var(--font); color: rgba(255,244,224,.7); }

  #chips { position: absolute; left: 650px; top: 200px; width: 1190px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .chip { height: 112px; border: 4px solid var(--c, var(--muted)); border-radius: 16px; background: var(--cream); box-shadow: 0 6px 0 rgba(43,27,23,.25); position: relative; display: flex; align-items: center; padding-left: 8px; gap: 8px; overflow: hidden; }
  .chip .av { width: 74px; height: 102px; flex: none; position: relative; }
  .chip .av canvas { position: absolute; left: 0; bottom: 0; width: 72px; height: 102px; transform-origin: 50% 100%; animation: breathe .9s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scaleY(1) translateY(0); } to { transform: scaleY(1.03) translateY(-1px); } }
  .chip .nm { font: 800 30px/1 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .chip .sub { font: 600 18px var(--font); color: var(--muted); margin-top: 4px; }
  .chip .num { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid var(--ink); color: #fff; font: 800 20px/28px var(--font); text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .chip.empty { background: rgba(255,244,224,.08); border-style: dashed; border-color: rgba(255,244,224,.28); box-shadow: none; }
  .chip.empty .av canvas { display: none; }
  .chip.empty .nm { color: rgba(255,244,224,.55); font-size: 24px; }
  .chip.empty .num { background: transparent; border: 3px dashed rgba(255,244,224,.28); color: rgba(255,244,224,.4); text-shadow: none; }
  .chip.gone { filter: grayscale(.8); opacity: .6; }
  .chip.pop { animation: chippop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes chippop { from { transform: scale(.85) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

  #setup { position: absolute; left: 650px; top: 470px; width: 1190px; height: 580px; padding: 14px 26px; }
  #setup h3 { margin: 0 0 8px; font: 800 22px var(--font); letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { height: 52px; padding: 0 20px; border: 3px solid var(--ink); border-radius: 26px; background: #F1E3C6; color: var(--ink); font: 800 24px var(--font); transition: transform .1s; }
  .pill:hover { transform: scale(1.05); }
  .pill.sel { background: linear-gradient(var(--tomato) 0 50%, var(--tomato2) 50% 100%); color: var(--cream); text-shadow: 0 2px 0 rgba(43,27,23,.4); }
  .hint { font: 600 22px var(--font); color: var(--muted); margin-top: 8px; min-height: 28px; }
  #setup .row { display: flex; gap: 40px; }
  #maps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .mc { height: 100px; padding: 6px 10px; border: 3px solid var(--ink); border-radius: 14px; background: #F1E3C6; color: var(--ink); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; transition: transform .1s; min-width: 0; }
  .mc:hover { transform: scale(1.03); }
  .mc .t { font: 800 20px/1.08 var(--font); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mc .t b { color: var(--tomato2); margin-right: 6px; }
  .mc .m { font: 700 17px/1.1 var(--font); color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .mc .st { color: #B9770E; letter-spacing: 1px; }
  .mc .tag { font: 800 13px/18px var(--font); font-style: normal; padding: 0 6px; border-radius: 9px; border: 2px solid var(--ink); background: var(--cheese); color: var(--ink); }
  .mc .tag.l { background: #9AD0EE; }
  .mc .why { font: 700 15px/1.1 var(--font); color: #B9770E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc.rec { background: #F6E8CB; }
  .mc.warn { border-style: dashed; }
  .mc.blk { opacity: .45; filter: grayscale(.85); cursor: not-allowed; }
  .mc.blk:hover { transform: none; }
  .mc.blk .why { color: var(--muted); }
  .mc.sel { background: linear-gradient(var(--tomato) 0 50%, var(--tomato2) 50% 100%); color: var(--cream); text-shadow: 0 2px 0 rgba(43,27,23,.4); }
  .mc.sel .t b, .mc.sel .m, .mc.sel .st, .mc.sel .why { color: var(--cream); }
  .mc.special { background: #E6D5AF; justify-content: center; }
  .mc.special.sel { background: linear-gradient(var(--tomato) 0 50%, var(--tomato2) 50% 100%); }
  #minimap { position: absolute; right: 26px; top: 12px; border: 4px solid var(--ink); border-radius: 10px; background: #2b1b17; width: 232px; height: 130px; }
  #hints { position: absolute; left: 26px; right: 26px; bottom: 10px; }
  #hints .hint.notice { color: var(--tomato2); }
  #hints .hint { margin: 0; min-height: 30px; }
  #seedrow { margin-top: 8px; font: 600 22px var(--font); color: var(--muted); }
  #seedrow b { color: var(--ink); }
  #again-seed { height: 40px; font-size: 20px; padding: 0 16px; margin-left: 10px; }


  /* start menu: the game cards live on the dark background, under the connected players */
  #menuui h3 { position: absolute; left: 650px; top: 470px; margin: 0; font: 800 24px var(--font); letter-spacing: 4px; text-transform: uppercase; color: rgba(255,244,224,.7); }
  #menucards { position: absolute; left: 650px; top: 512px; width: 1190px; height: 538px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 22px; }
  .gc { position: relative; display: flex; flex-direction: column; min-height: 0; padding: 0; text-align: left; border: 4px solid var(--ink); border-radius: 20px; background: var(--cream); color: var(--ink); box-shadow: 0 8px 0 rgba(43,27,23,.35); overflow: hidden; transition: transform .12s, box-shadow .12s, filter .12s; }
  .gc .art { flex: 1; min-height: 0; width: 100%; object-fit: cover; display: block; border-bottom: 4px solid var(--ink); }
  .gc .body { flex: none; padding: 12px 18px 14px; }
  .gc .nm { font: 800 32px/1.05 var(--font); }
  .gc .bl { font: 600 20px/1.2 var(--font); color: var(--muted); margin-top: 4px; min-height: 48px; }
  .gc .pl { display: inline-block; margin-top: 8px; padding: 2px 14px; border: 3px solid var(--ink); border-radius: 16px; background: var(--cheese); font: 800 20px var(--font); }
  .gc .tag { position: absolute; left: 12px; top: 12px; right: 12px; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 12px; background: var(--cream); font: 800 19px/1.15 var(--font); box-shadow: 0 4px 0 rgba(43,27,23,.3); display: none; }
  .gc.few .tag, .gc.many .tag { display: block; color: var(--tomato2); }
  .gc.few .art, .gc.many .art, .gc.few .body, .gc.many .body { filter: grayscale(.85); opacity: .55; }
  .gc.few, .gc.many { cursor: not-allowed; }
  .gc.soon { cursor: default; box-shadow: 0 6px 0 rgba(43,27,23,.25); background: #E9DBBD; }
  .gc.soon .art { filter: grayscale(.9) brightness(.8); opacity: .8; }
  .gc.soon .nm { color: var(--muted); }
  .gc.soon .tag { display: block; left: auto; right: -2px; top: 22px; border-radius: 12px 0 0 12px; background: var(--cheese); color: var(--ink); letter-spacing: 2px; text-transform: uppercase; }
  .gc.ready:hover, .gc.sel.ready { transform: translateY(-6px) scale(1.02); }
  .gc.sel { border-color: var(--cheese); outline: 6px solid var(--ink); box-shadow: 0 0 0 6px var(--cheese), 0 14px 0 rgba(43,27,23,.4); z-index: 2; }
  .gc.sel.ready .nm { color: var(--tomato2); }
  .gc.nope { animation: nope .35s; }
  @keyframes nope { 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  #menuhint { position: absolute; left: 80px; top: 872px; width: 520px; text-align: center; font: 700 28px/1.5 var(--font); color: var(--cream); }
  #menuhint span { margin: 0 10px; white-space: nowrap; }
  #menuhint small { font: 600 20px var(--font); color: rgba(255,244,224,.6); }
  kbd { display: inline-block; min-width: 38px; margin: 0 2px; padding: 0 8px; border: 3px solid var(--ink); border-radius: 9px; background: var(--cream); color: var(--ink); font: 800 22px/32px var(--font); text-align: center; box-shadow: 0 3px 0 rgba(43,27,23,.5); }
  #back { position: absolute; left: 1380px; top: 70px; height: 60px; font-size: 26px; padding: 0 28px; background: #F1E3C6; }

  #results { position: fixed; inset: 0; background: rgba(28,16,12,.62); backdrop-filter: blur(5px); }
  #resultsInner { position: absolute; inset: 0; margin: auto; width: 1060px; height: max-content; padding: 26px 40px 32px; text-align: center; animation: slideup .6s cubic-bezier(.2,1.2,.3,1) both; }
  @keyframes slideup { from { transform: translateY(1100px); } to { transform: none; } }
  #results h2 { margin: 0; font: 800 68px/1 var(--font); color: var(--tomato); -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 rgba(43,27,23,.3); }
  #stars { display: flex; justify-content: center; gap: 18px; height: 128px; margin-top: 10px; }
  #stars canvas { width: 120px; height: 120px; transform: translateY(-700px) scale(2.2); opacity: 0; }
  #stars canvas.drop { animation: stardrop .6s cubic-bezier(.3,1.5,.5,1) forwards; }
  @keyframes stardrop { 0% { transform: translateY(-700px) scale(2.2) rotate(-40deg); opacity: 0; } 25% { opacity: 1; } 100% { transform: none; opacity: 1; } }
  #stars canvas.off2 { filter: grayscale(1) brightness(.75); }
  #bigscore { font: 800 100px/1 var(--font); color: var(--ink); margin-top: 0; }
  #bigscore small { display: block; font: 800 22px var(--font); letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }
  #starline { font: 700 24px var(--font); color: var(--muted); margin-top: 6px; }
  #starline b { color: var(--ink); }
  #stats { display: flex; justify-content: center; gap: 24px; margin: 14px 0 8px; }
  .stat { min-width: 190px; padding: 10px 0; border-radius: 14px; border: 3px solid var(--ink); background: #F6E8CB; }
  .stat b { display: block; font: 800 56px/1.05 var(--font); }
  .stat span { font: 800 19px var(--font); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .stat.good b { color: var(--basil2); } .stat.bad b { color: var(--danger); } .stat.gold b { color: #B07A0A; }
  #podium { display: flex; justify-content: center; align-items: flex-end; gap: 14px; height: 330px; margin-top: 8px; }
  .pod { width: 200px; text-align: center; position: relative; }
  .pod canvas { width: 130px; height: 184px; display: block; margin: 0 auto -14px; position: relative; z-index: 2; animation: breathe .9s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .pod .step { border: 4px solid var(--ink); border-radius: 14px 14px 0 0; overflow: hidden; background: linear-gradient(#F4D98B, #D9A21F); color: var(--ink); padding-top: 14px; font: 800 28px/1.1 var(--font); }
  .pod .step small { display: block; font: 800 22px var(--font); color: rgba(43,27,23,.7); margin-top: 2px; }
  .pod.p1 .step { height: 150px; background: linear-gradient(#FFE68A, #E8A317); } .pod.p2 .step { height: 120px; background: linear-gradient(#EEF3F6, #9FB0BA); } .pod.p3 .step { height: 100px; background: linear-gradient(#E5B07A, #B97A40); }
  .pod .crown { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font-size: 54px; z-index: 3; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); animation: crownbob 1s ease-in-out infinite alternate; }
  @keyframes crownbob { to { transform: translateX(-50%) translateY(-6px) rotate(4deg); } }
  #again { margin-top: 26px; }

  #howto { position: fixed; inset: 0; z-index: 40; background: rgba(28,16,12,.78); backdrop-filter: blur(5px); }
  #howtoInner { position: absolute; inset: 0; margin: auto; width: 1480px; height: max-content; padding: 26px 48px 30px; animation: slideup .5s cubic-bezier(.2,1.2,.3,1) both; }
  #howto h2 { margin: 0; text-align: center; font: 800 68px/1 var(--font); color: var(--tomato); -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 rgba(43,27,23,.3); }
  #howto .gname { text-align: center; font: 800 30px var(--font); letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin: 14px 0 18px; }
  #howto .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; }
  #howto .steps li { display: flex; align-items: center; gap: 20px; min-height: 160px; padding: 16px 22px; border: 4px solid var(--ink); border-radius: 18px; background: #F6E8CB; position: relative; box-shadow: 0 6px 0 rgba(43,27,23,.2); }
  #howto .steps .n { position: absolute; left: -16px; top: -16px; width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(var(--tomato) 0 50%, var(--tomato2) 50% 100%); border: 4px solid var(--ink); color: var(--cream); font: 800 32px/44px var(--font); text-align: center; text-shadow: 0 2px 0 rgba(43,27,23,.4); }
  #howto .steps .ic { flex: none; width: 112px; height: 112px; border-radius: 50%; background: var(--cream); border: 4px solid var(--ink); display: flex; align-items: center; justify-content: center; color: var(--tomato2); }
  #howto .steps .ic .ico { width: 70px; height: 70px; }
  #howto .steps .tx { font: 800 40px/1.12 var(--font); color: var(--ink); }
  #howto .note { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 22px; font: 800 36px var(--font); color: var(--basil2); }
  #howto .note .ic { width: 48px; height: 48px; color: var(--cheese2); }
  #howto .note .ico { width: 100%; height: 100%; fill: var(--cheese); }
  #howtobar { height: 18px; margin-top: 24px; border: 3px solid var(--ink); border-radius: 12px; background: #E5D4B0; overflow: hidden; }
  #howtofill { height: 100%; width: 0; background: linear-gradient(var(--basil) 0 50%, var(--basil2) 50% 100%); }
  #howtohint { text-align: center; font: 800 30px var(--font); color: var(--muted); margin-top: 12px; }
  #howtohint b { color: var(--ink); }
  #howtobtn { margin-top: 10px; height: 44px; font-size: 22px; padding: 0 18px; }

  #hudhint { display: none; }
  #iris { position: fixed; left: 50%; top: 50%; width: 260vmax; height: 260vmax; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 60; border: 26px solid var(--crust); outline: 6px solid var(--ink); box-shadow: 0 0 0 150vmax var(--cocoa), inset 0 0 0 14px #D7362A; display: none; }

  #debug { position: fixed; top: 8px; right: 8px; background: #000c; color: #eee; padding: 8px 10px; border-radius: 6px; min-width: 420px; font: 13px ui-monospace, Menlo, monospace; z-index: 70; }
  #debug table { border-collapse: collapse; width: 100%; }
  #debug th, #debug td { text-align: right; padding: 1px 6px; }
  #debug th:first-child, #debug td:first-child { text-align: left; }
  #debug button { margin-right: 6px; margin-top: 6px; }
  #warn { color: #ff5252; font-weight: bold; }
</style>
</head>
<body>
<div id="game"></div>
<div id="lobbybg"></div>
<div id="stage" class="stage">
  <section id="lobby">
    <canvas id="logo" width="208" height="228"></canvas>
    <h1 class="title" id="title">Pichiclub</h1>
    <div class="platform" id="platform">Elige un juego</div>
    <div id="joincard" class="panel">
      <div class="lbl">Escanea y únete</div>
      <div id="qr"></div>
      <div id="code"></div>
      <div id="joinurl"></div>
    </div>
    <div id="chips"></div>
    <div id="menuui">
      <h3 id="menuh">Juegos</h3>
      <div id="menucards"></div>
      <div id="menuhint"><span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> elegir</span><span><kbd>Enter</kbd> jugar</span><br><small>M sonido · los celulares esperan: decide la pantalla</small></div>
    </div>
    <div id="lobbyui">
      <button id="back" class="pill">‹ Elegir otro juego · Esc</button>
      <div id="setup" class="panel">
        <div class="row">
          <div><h3>Dificultad</h3><div id="diffs" class="seg"></div></div>
        </div>
        <h3 style="margin-top:12px">Mapa <span id="mapfor" style="letter-spacing:0;text-transform:none"></span></h3>
        <div id="maps"></div>
        <div id="seedrow" class="off">Semilla <b id="seed"></b> <button id="again-seed" class="pill">Otra</button></div>
        <canvas id="minimap" width="232" height="130"></canvas>
        <div id="hints"><div id="diffinfo" class="hint"></div><div id="mapinfo" class="hint"></div></div>
      </div>
      <button id="start" class="btn" disabled>¡A cocinar!</button>
      <div id="starthint">Enter para empezar<br><button id="howtobtn" class="pill">H · Cómo se juega</button><br><small>M sonido · S sacudida de pantalla</small></div>
    </div>
  </section>
</div>
  <section id="results" class="off">
    <div class="stage"><div id="resultsInner" class="panel">
      <h2>¡Fin de la ronda!</h2>
      <div id="stars"></div>
      <div id="bigscore"><small>Puntaje del equipo</small><span id="finalscore">0</span></div>
      <div id="starline"></div>
      <div id="stats"></div>
      <div id="podium"></div>
      <button id="again" class="btn">Volver al lobby</button>
    </div></div>
  </section>
<section id="howto" class="off">
  <div class="stage"><div id="howtoInner" class="panel">
    <h2>Cómo se juega</h2>
    <div class="gname" id="howtogame"></div>
    <div id="howtobody"></div>
    <div id="howtobar"><div id="howtofill"></div></div>
    <div id="howtohint"></div>
  </div></div>
</section>
