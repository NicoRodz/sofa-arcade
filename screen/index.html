<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pichiclub</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font: 13px ui-monospace, Menlo, monospace; }
  #game { position: fixed; inset: 0; }
  #debug { position: fixed; top: 8px; right: 8px; background: #000c; padding: 8px 10px; border-radius: 6px; min-width: 420px; }
  #debug table { border-collapse: collapse; width: 100%; }
  #debug th, #debug td { text-align: right; padding: 1px 6px; }
  #debug th:first-child, #debug td:first-child { text-align: left; }
  #debug button { margin-right: 6px; margin-top: 6px; }
  #warn { color: #ff5252; font-weight: bold; }
  #debug.off { display: none; }
  .panel { position: fixed; background: #000c; border-radius: 12px; font: 16px system-ui, sans-serif; }
  #lobby { left: 24px; top: 24px; padding: 20px; width: 300px; text-align: center; }
  #lobby.off, #setup.off, #hud.off, #results.off { display: none; }
  #code { font: bold 56px ui-monospace, Menlo, monospace; letter-spacing: 10px; margin: 4px 0 12px; }
  #qr { width: 220px; height: 220px; background: #fff; border-radius: 6px; margin: 0 auto; }
  #qr svg { width: 100%; height: 100%; display: block; }
  #joinurl { margin: 8px 0 12px; font-size: 14px; user-select: all; }
  #plist { list-style: none; margin: 0 0 14px; padding: 0; text-align: left; font-size: 20px; min-height: 28px; }
  #plist li { padding: 3px 0; }
  #plist .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; }
  #plist li.gone { color: #777; }
  #plist li.gone .dot { opacity: .3; }
  button.big { font: bold 20px system-ui, sans-serif; padding: 10px 28px; border-radius: 8px; border: 0; background: #69f0ae; color: #000; }
  button.big:disabled { opacity: .35; }
  #lobby h1 { margin: 0 0 8px; font: bold 34px system-ui, sans-serif; letter-spacing: 1px; }
  #setup { left: 372px; top: 24px; width: 460px; padding: 20px; }
  #setup.off { display: none; }
  #setup h3 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #aaa; }
  .card { display: block; width: 100%; text-align: left; font: 16px system-ui, sans-serif; color: #eee; background: #ffffff14; border: 2px solid transparent; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .card b { display: block; font-size: 20px; margin-bottom: 4px; }
  .card small { color: #bbb; }
  .card.sel { border-color: #69f0ae; background: #69f0ae22; }
  .chips { display: flex; gap: 8px; margin-bottom: 8px; }
  .chip { flex: 1; font: bold 16px system-ui, sans-serif; color: #eee; background: #ffffff14; border: 2px solid transparent; border-radius: 8px; padding: 8px 6px; cursor: pointer; }
  .chip.sel { border-color: #69f0ae; background: #69f0ae22; }
  .hint { color: #aaa; font-size: 13px; margin-bottom: 16px; }
  .chips.wrap { flex-wrap: wrap; }
  .chips.wrap .chip { flex: 0 0 auto; font-size: 14px; padding: 6px 10px; }
  #mappreview { margin: 0 0 6px; font: 13px/1.1 ui-monospace, Menlo, monospace; color: #bbb; background: #0006; border-radius: 6px; padding: 8px; white-space: pre; }
  .off { display: none; }
  #hud { right: 16px; top: 14px; padding: 6px 20px; text-align: center; }
  #timer { font: bold 40px ui-monospace, Menlo, monospace; }
  #scores { display: flex; gap: 16px; font-size: 18px; }
  #results { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 28px 40px; text-align: center; min-width: 320px; }
  #results h2 { margin: 0 0 14px; }
  #rank { list-style: none; margin: 0 0 18px; padding: 0; font-size: 24px; text-align: left; }
  #rank li { padding: 4px 0; display: flex; justify-content: space-between; gap: 32px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="lobby" class="panel">
  <h1>Pichiclub</h1>
  <div>Código de sala</div>
  <div id="code"></div>
  <div id="qr"></div>
  <div id="joinurl"></div>
  <ul id="plist"></ul>
  <button id="start" class="big" disabled>Iniciar (Enter)</button>
</div>
<div id="setup" class="panel">
  <h3>Juego</h3>
  <div id="games" style="margin-bottom:16px"></div>
  <h3>Dificultad</h3>
  <div id="diffs" class="chips"></div>
  <div id="diffinfo" class="hint"></div>
  <h3>Mapa</h3>
  <div id="maps" class="chips wrap"></div>
  <div id="seedrow" class="hint off">Semilla <b id="seed" style="color:#eee;font-size:16px"></b> <button id="again-seed" class="chip" style="flex:none;padding:4px 12px;margin-left:8px">Otra</button></div>
  <pre id="mappreview"></pre>
  <div id="mapinfo" class="hint"></div>
</div>
<div id="hud" class="panel off">
  <div id="timer"></div>
  <div id="scores"></div>
  <div id="mapname" style="font-size:13px;color:#aaa"></div>
</div>
<div id="results" class="panel off">
  <h2>Resultados</h2>
  <ol id="rank"></ol>
  <button id="again" class="big">Volver al lobby (Enter)</button>
</div>
<div id="debug" class="off">
  <div id="warn"></div>
  <div id="summary"></div>
  <table id="table"></table>
  <div>D: ocultar</div><button id="csv">Export CSV</button><button id="clear">Clear</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
