<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Sofa Arcade</title>
<link rel="stylesheet" href="/base.css" /><link rel="stylesheet" href="/screens.css" />
<link rel="stylesheet" href="/portrait.css" /><link rel="stylesheet" href="/assist-help.css" />
</head>
<body>
<form id="join" autocomplete="off">
  <h1 class="brand">Sofa Arcade</h1>
  <input id="name" maxlength="16" placeholder="Tu nombre" />
  <button type="submit">Entrar</button>
</form>
<div id="pad">
  <div id="zone"></div>
  <div id="stickhint"></div><div id="stickLbl" class="plq"></div>
  <div id="btnA" class="act"></div><div id="lblA" class="plq"></div>
  <div id="btnB" class="act"></div><div id="lblB" class="plq"></div>
  <div id="hud"></div>
  <div id="signals" role="group" aria-label="Señales al compañero">
    <button class="sg l" type="button" data-sig="arrowL" aria-label="Señal: por la izquierda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="sg u" type="button" data-sig="arrowU" aria-label="Señal: arriba"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="sg r" type="button" data-sig="arrowR" aria-label="Señal: por la derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="sg w" type="button" data-sig="wait" aria-label="Señal: ¡espera!">✋</button>
    <button class="sg d" type="button" data-sig="arrowD" aria-label="Señal: abajo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="sg go" type="button" data-sig="go" aria-label="Señal: ¡ya! (mantén apretado para la cuenta 3-2-1)">¡Ya!</button>
  </div>
  <div id="slip">¡Resbalaste!</div>
  <div id="teamchip"><span id="tcicon2"></span><span id="tcname2"></span><small id="tcside2"></small></div>
  <div id="puesto"><span class="pi" id="pico"></span><div class="pt"><b id="pname"></b><span id="phint"></span></div><button id="pswap" type="button">Cambiar</button></div>
  <div id="school"><div class="sh"><span id="schoolstep"></span><span id="schooldots"></span></div><b id="schooltext"></b><div class="sb"><button id="schoolskip" type="button">Ya sé · saltar</button><button id="schoolall" type="button">Saltar a todos</button></div></div>
</div>
<div id="wait" class="overlay"><h1 class="brand">Sofa Arcade</h1><div id="game"></div><div id="setup" style="opacity:.8"></div><div id="teamcard"><span id="tcicon"></span><span id="tcname"></span><small id="tcside"></small></div><button id="teamswap" type="button">Cambiar de equipo</button><div id="waitmsg">Esperando que inicie la partida</div><div id="who" style="opacity:.7"></div><div id="lobbybtns"><button id="assist" type="button" aria-pressed="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 40V22"/><ellipse cx="14" cy="18" rx="11" ry="4.5"/><ellipse cx="34" cy="18" rx="11" ry="4.5"/><circle cx="24" cy="19" r="3.4"/></svg><span id="assistlbl">Ayudante: no</span></button><button id="howtoopen" type="button">Cómo se juega</button></div></div>
<div id="choosing" class="overlay"><h1 class="brand">Sofa Arcade</h1><div class="big">Eligiendo juego…</div><div style="opacity:.8">La pantalla decide</div><div id="who2" style="opacity:.7"></div></div>
<div id="results" class="overlay"><div>Fin de la ronda</div><div id="verdict" class="big"></div><div id="rank" class="big"></div><div id="myscore"></div></div>
<div id="howto" class="overlay"><div class="hhead"><h2>Cómo se juega</h2><div id="howtogame" class="gname"></div></div><div id="howtobody" style="display:contents"></div><button id="howtoclose" type="button">Entendido</button></div>
<div id="rotate" class="overlay"><div class="big">&#8635;</div><div>Gira tu teléfono</div></div>
<div id="remote" role="group" aria-label="Control remoto del Capitán">
  <button class="rb help" type="button" data-nav="help" aria-label="Cómo se juega">?</button>
  <button class="rb up" type="button" data-nav="up" aria-label="Arriba"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
  <button class="rb back" type="button" data-nav="back" aria-label="Atrás">Atrás</button>
  <button class="rb left" type="button" data-nav="left" aria-label="Izquierda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
  <button class="rb ok" type="button" data-nav="ok" aria-label="OK">OK</button>
  <button class="rb right" type="button" data-nav="right" aria-label="Derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
  <span class="crown" aria-hidden="true">👑</span>
  <button class="rb down" type="button" data-nav="down" aria-label="Abajo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
</div>
<button id="zoomfix" type="button">Pantalla ampliada. Toca para restablecer</button>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
