<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Pichiclub</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font: 16px system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
  #join { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; }
  #join input { font-size: 20px; padding: 12px; width: 70%; max-width: 320px; border-radius: 8px; border: 0; -webkit-user-select: text; user-select: text; }
  button { font-size: 20px; padding: 12px 28px; border-radius: 8px; border: 0; background: #40c4ff; color: #000; }
  #pad { position: fixed; inset: 0; visibility: hidden; }
  body[data-view=playing] #pad { visibility: visible; }
  body[data-view] #join { display: none; }
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; background: #111; font-size: 22px; padding: 16px; }
  body[data-view=lobby] #wait, body[data-view=results] #results { display: flex; }
  #rotate { z-index: 10; background: #111; }
  @media (orientation: portrait) { body[data-view] #rotate { display: flex; } }
  .big { font-size: 56px; font-weight: bold; }
  #zone { position: absolute; left: 0; top: 0; width: 50%; height: 100%; touch-action: none; }
  .act { position: absolute; width: 28vmin; height: 28vmin; border-radius: 50%; background: #ff5252; color: #000; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; touch-action: none; }
  #btnA { right: 5%; top: 54%; }
  #btnB { right: 27%; top: 16%; background: #40c4ff; }
  .act.down { background: #ffd740 !important; }
  .brand { font: bold 40px system-ui, sans-serif; letter-spacing: 1px; margin: 0; color: var(--c, #40c4ff); }
  #hud { position: absolute; top: 6px; left: 8px; font-size: 13px; opacity: .7; pointer-events: none; }
</style>
</head>
<body>
<form id="join" autocomplete="off">
  <h1 class="brand">Pichiclub</h1>
  <input id="name" maxlength="16" placeholder="Tu nombre" />
  <button type="submit">Entrar</button>
</form>
<div id="pad">
  <div id="zone"></div>
  <div id="btnA" class="act">A</div>
  <div id="btnB" class="act">B</div>
  <div id="hud"></div>
</div>
<div id="wait" class="overlay"><h1 class="brand">Pichiclub</h1><div id="game" style="font-weight:bold"></div><div id="setup" style="opacity:.8"></div><div>Esperando que inicie la partida</div><div id="who" style="opacity:.7"></div></div>
<div id="results" class="overlay"><div>Fin de la ronda</div><div id="rank" class="big"></div><div id="myscore"></div></div>
<div id="rotate" class="overlay"><div class="big">&#8635;</div><div>Gira tu teléfono</div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
