<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Pichiclub</title>
<style>
  :root {
    --ink: #2B1B17; --cream: #FFF4E0; --cocoa: #3A2A24; --tomato: #E63B2E; --tomato2: #B5281F; --basil: #3FA34D; --basil2: #2A7A36;
    --cheese: #FFD23F; --cheese2: #E8A317; --muted: #8A7461; --c: #E63B2E;
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cocoa); color: var(--cream); font: 800 18px var(--font); overscroll-behavior: none; }
  body::before { content: ""; position: fixed; inset: 0; background: repeating-conic-gradient(rgba(255,255,255,.15) 0 25%, transparent 0 50%) 0 0 / 80px 80px; opacity: .1; pointer-events: none; }
  #join { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; }
  #join input { font: 800 20px var(--font); /* keep >= 16px: iOS zooms into smaller inputs on focus */ padding: 12px 16px; width: 70%; max-width: 320px; border-radius: 14px; border: 4px solid var(--ink); background: var(--cream); color: var(--ink); text-align: center; -webkit-user-select: text; user-select: text; }
  button { font: 800 22px var(--font); color: var(--cream); padding: 12px 28px; border-radius: 16px; border: 4px solid var(--ink); background: linear-gradient(var(--tomato) 0 50%, var(--tomato2) 50% 100%); box-shadow: 0 6px 0 rgba(43,27,23,.4); text-shadow: 0 2px 0 rgba(43,27,23,.4); }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(43,27,23,.4); }
  #pad { position: fixed; inset: 0; visibility: hidden; }
  body[data-view=playing] #pad { visibility: visible; }
  body[data-view] #join { display: none; }
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; gap: 10px; align-items: center; justify-content: center; text-align: center; font-size: 22px; padding: 16px; }
  body[data-view=lobby] #wait, body[data-view=results] #results, body[data-view=menu] #choosing { display: flex; }
  #rotate { z-index: 10; }
  @media (orientation: portrait) { body[data-view] #rotate { display: flex; } }
  .big { font-size: 56px; font-weight: 800; }
  #zone { position: absolute; left: 0; top: 0; width: 50%; height: 100%; }
  #stickhint { position: absolute; left: 11%; top: 50%; width: 32vmin; height: 32vmin; margin-top: -16vmin; border-radius: 50%; border: 4px dashed rgba(255,244,224,.35); color: rgba(255,244,224,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; transition: opacity .15s; }
  #stickhint .ico { width: 12vmin; height: 12vmin; }
  #stickhint .lbl { font-size: 4.6vmin; }
  #stickhint.active { opacity: 0; }
  .act { position: absolute; width: 34vmin; height: 34vmin; border-radius: 50%; border: 5px solid var(--ink); background: linear-gradient(var(--btn, var(--tomato)) 0 50%, var(--btn2, var(--tomato2)) 50% 100%); color: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6vmin; line-height: 1; text-align: center; padding: 0 1vmin 1vmin; box-shadow: 0 1.8vmin 0 rgba(43,27,23,.4); text-shadow: 0 2px 0 rgba(43,27,23,.45); }
  .act .ico { width: 12.5vmin; height: 12.5vmin; filter: drop-shadow(0 2px 0 rgba(43,27,23,.45)); }
  .act .lbl { font-size: 4.8vmin; }
  .act .hold { font-size: 2.7vmin; opacity: .85; }
  #btnA { right: 4%; top: 52%; }
  #btnB { right: 27%; top: 9%; --btn: var(--cheese); --btn2: var(--cheese2); color: var(--ink); text-shadow: 0 2px 0 rgba(255,255,255,.35); }
  #btnB .ico { filter: none; }
  body[data-view=playing]::before { content: ''; position: fixed; inset: 0; z-index: 3; pointer-events: none; box-shadow: inset 0 0 0 1.1vmin var(--c); } /* R25: the phone wears the chef's colour */
  body.flash::after { content: ''; position: fixed; inset: 0; z-index: 3; pointer-events: none; background: var(--c); opacity: .4; }
  .act.down { transform: translateY(1.2vmin); box-shadow: 0 .5vmin 0 rgba(43,27,23,.4); filter: brightness(1.12); }
  .brand { font: 800 44px var(--font); letter-spacing: 1px; margin: 0; color: var(--c); -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 rgba(43,27,23,.35); }
  #choosing .big { font-size: 40px; }
  #choosing .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  #game { font-size: 24px; color: var(--cheese); }
  #howto { z-index: 5; background: var(--cocoa); justify-content: flex-start; gap: 6px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  body[data-view][data-howto=open] #howto { display: flex; }
  #howto h2 { margin: 0; font: 800 26px/1 var(--font); color: var(--c); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; }
  #howto .gname { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,244,224,.6); }
  #howto .steps { list-style: none; margin: 4px 0 0; padding: 0; width: 100%; max-width: 760px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; flex: 1; min-height: 0; }
  #howto .steps li { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border: 3px solid var(--ink); border-radius: 14px; background: var(--cream); color: var(--ink); position: relative; text-align: left; }
  #howto .steps .n { position: absolute; left: -8px; top: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--tomato); border: 3px solid var(--ink); color: var(--cream); font: 800 15px/20px var(--font); text-align: center; }
  #howto .steps .ic { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; color: var(--tomato2); background: #F6E8CB; }
  #howto .steps .ico { width: 30px; height: 30px; }
  #howto .steps .tx { font: 800 clamp(14px, 4.4vmin, 19px)/1.15 var(--font); }
  #howto .note { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--cheese); }
  #howto .note .ic { width: 22px; height: 22px; }
  #howto .note .ico { width: 100%; height: 100%; fill: var(--cheese); }
  #howtoclose { margin-top: 2px; font-size: 18px; padding: 8px 24px; }
  #howtoopen { margin-top: 6px; font-size: 16px; padding: 6px 16px; background: linear-gradient(var(--basil) 0 50%, var(--basil2) 50% 100%); }
  #zoomfix { display: none; position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 30; font-size: 17px; padding: 10px 18px; background: var(--cream); color: var(--ink); text-shadow: none; }
  body.zoomed #zoomfix { display: block; }
  #puesto { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: min(46vw, 400px); display: none; align-items: center; gap: 8px; padding: 6px 8px; border: 3px solid var(--ink); border-radius: 16px; background: var(--cream); color: var(--ink); box-shadow: 0 4px 0 rgba(43,27,23,.35); }
  body[data-puesto=on] #puesto { display: flex; }
  #puesto .pi { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--c); background: #F6E8CB; display: flex; align-items: center; justify-content: center; color: var(--tomato2); }
  #puesto .pi .ico { width: 26px; height: 26px; }
  #puesto .pt { min-width: 0; flex: 1; }
  #pname { display: block; font: 800 16px/1.05 var(--font); }
  #phint { display: block; font: 700 12px/1.1 var(--font); color: var(--muted); }
  #pswap { flex: none; font-size: 13px; padding: 6px 10px; border-width: 3px; border-radius: 10px; box-shadow: 0 3px 0 rgba(43,27,23,.4); }
  #hud { position: absolute; top: 6px; left: 10px; font-size: 14px; color: var(--c); opacity: .9; pointer-events: none; }
</style>
</head>
<body>
<form id="join" autocomplete="off">
  <h1 class="brand">Pichiclub</h1>
  <input id="name" maxlength="16" placeholder="Tu nombre" />
  <button type="submit">Entrar</button>
</form>
<div id="pad">
  <div id="zone"></div>
  <div id="stickhint"></div>
  <div id="btnA" class="act"></div>
  <div id="btnB" class="act"></div>
  <div id="hud"></div>
  <div id="puesto"><span class="pi" id="pico"></span><div class="pt"><b id="pname"></b><span id="phint"></span></div><button id="pswap" type="button">Cambiar</button></div>
</div>
<div id="wait" class="overlay"><h1 class="brand">Pichiclub</h1><div id="game"></div><div id="setup" style="opacity:.8"></div><div>Esperando que inicie la partida</div><div id="who" style="opacity:.7"></div><button id="howtoopen" type="button">Cómo se juega</button></div>
<div id="choosing" class="overlay"><h1 class="brand">Pichiclub</h1><div class="big">Eligiendo juego<span class="dots"></span></div><div style="opacity:.8">La pantalla decide</div><div id="who2" style="opacity:.7"></div></div>
<div id="results" class="overlay"><div>Fin de la ronda</div><div id="rank" class="big"></div><div id="myscore"></div></div>
<div id="howto" class="overlay"><h2>Cómo se juega</h2><div id="howtogame" class="gname"></div><div id="howtobody" style="display:contents"></div><button id="howtoclose" type="button">Entendido</button></div>
<div id="rotate" class="overlay"><div class="big">&#8635;</div><div>Gira tu teléfono</div></div>
<button id="zoomfix" type="button">Pantalla ampliada. Toca para restablecer</button>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
